name: XAUUSD Signal Bot

on:
  schedule:
    # Run every 30 minutes during ALL active hours (00-21 UTC, Mon-Fri)
    # Single cron line = no overlap, no race condition
    - cron: "0,30 0-21 * * 1-5"

  workflow_dispatch:  # Manual trigger

# CRITICAL: prevent overlapping runs
concurrency:
  group: signal-bot
  cancel-in-progress: false  # don't kill running job, just queue (or skip if queued)

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests

      - name: Run signal bot
        env:
          TELEGRAM_BOT_TOKEN:  ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
          ANTHROPIC_API_KEY:   ${{ secrets.ANTHROPIC_API_KEY }}
          TWELVEDATA_API_KEY:  ${{ secrets.TWELVEDATA_API_KEY }}
          GITHUB_TOKEN:        ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPO:         ${{ github.repository }}
        run: python xauusd_signal_bot.py
